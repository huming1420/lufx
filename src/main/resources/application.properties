server.port=8000

spring.datasource.url=jdbc:postgresql://localhost:5432/dashboard
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.initialize=true
spring.datasource.schema=classpath:sql/init_postgres.sql

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.lufax.dashboard.model
mybatis.configuration.map-underscore-to-camel-case=true

# LLM Adapter: mock | external
llm.adapter=mock

# PAIC Agent Gateway Configuration (production)
llm.base.url=http://agents-api-sze.paic.com.cn
llm.api.key=08a11d80ff624036863e22dd5b5d4a0a
llm.model=Qwen3.6-35B
llm.protocol=paic
llm.concurrency=2

# PAIC-specific settings
llm.paic.appId=ZHJYPT
llm.paic.botId=1089944

app.default-period=2026-03-YTD
app.prompt-version=v2
app.job-timeout-seconds=600
app.demo-seed.enabled=true
app.demo-seed.source-label=演示数据，待替换
