# H2 in-memory database for tests (PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.platform=h2

# Initialize schema from SQL file
spring.datasource.schema=classpath:schema-test.sql
spring.datasource.initialization-mode=always

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.lufax.dashboard.model.entity

# LLM adapter: use mock mode for all tests
llm.adapter=mock
app.demo-seed.enabled=false

# Logging (reduce noise during tests)
logging.level.com.lufax.dashboard=DEBUG
logging.level.org.springframework=INFO
